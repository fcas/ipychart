name: Run ipychart's backend tests
on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ipykernel
    - name: Install ipychart locally
      run: |
        pip install .
    - name: Run tests
      run: |
        pytest -v --tb=no --no-header --no-summary --disable-warnings